name: CI Pipeline (TimSezzz)

on:
  push:
    branches: [ master, main, DevOps ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: timesezzz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d timesezzz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        

    #Setup dan Build untuk Sisi Client (Frontend)
    - name: Install & Build Client
      working-directory: ./client
      run: |
        npm install
        npm run build

    # Setup dan Test untuk Sisi Server (Backend)
    - name: Install & Test Server
      working-directory: ./server
      run: |
        npm install
        npm test

    - name: Test PostgreSQL Integration
      working-directory: ./server
      run: npm run test:integration
      env:
        TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/timesezzz_test
